[package]
name = "orcaslicer-webconfig"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "server"]

[[bin]]
name = "app"

[dependencies]
wasm-bindgen = "=0.2.126"
log = "0.4"
yew = { version = "0.21", features = ["csr"] }
yew-router = { version = "0.18" }
web-sys = { version = "=0.3.103", features = [
    "Element",
    "DomRect",
    "HtmlElement",
    "Node",
    "Window",
    "Document",
    "File",
    "FileList",
    "FileReader",
    "HtmlInputElement",
    "ProgressEvent",
    "Blob",
    "Url",
    "HtmlAnchorElement",
    "KeyboardEvent",
    "Navigator",
    "Storage",
] }
js-sys = "0.3"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-net = "0.3"
wasm-bindgen-futures = "0.4"
futures = "0.3"
lazy_static = "1.5.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-logger = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
